name: Deploy to Hetzner VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/chouiaar/repo
            git fetch origin
            git reset --hard origin/main
            pnpm install
            pnpm --filter travel-agency build
            pnpm --filter api-server build
            cp -r /var/www/chouiaar/repo/artifacts/travel-agency/dist/. /var/www/chouiaar/frontend/
            pm2 restart all

